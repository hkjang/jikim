name: jikim

services:
  jikim:
    image: jikim:v0.2.12
    restart: unless-stopped
    init: true
    ports:
      - "8080:8080"
    environment:
      POSTGRES_DSN: "${POSTGRES_DSN:?POSTGRES_DSN is required}"
      BOOTSTRAP_ADMIN: "${BOOTSTRAP_ADMIN:?BOOTSTRAP_ADMIN is required}"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
