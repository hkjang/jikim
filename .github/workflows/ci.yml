name: 검증

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Go · React · Compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Go 설정
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 소스 검증
        run: ./scripts/verify.sh

  image:
    name: 폐쇄망 이미지 스모크 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: 릴리스 버전 확인
        id: version
        run: printf 'version=%s\n' "$(./scripts/version.sh)" >> "${GITHUB_OUTPUT}"

      - name: 런타임 이미지 빌드
        run: |
          docker build \
            --build-arg "VERSION=${{ steps.version.outputs.version }}" \
            --build-arg "COMMIT=${GITHUB_SHA}" \
            --build-arg "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "jikim:${{ steps.version.outputs.version }}" \
            .

      - name: 스모크 테스트용 PostgreSQL 이미지 준비
        run: docker pull postgres:17-alpine

      - name: 외부 통신 차단 스모크 테스트
        run: ./scripts/smoke-offline.sh "jikim:${{ steps.version.outputs.version }}"

      - name: 오프라인 번들 생성 및 검증
        run: |
          ./scripts/package-offline.sh dist
          ./scripts/verify-offline-bundle.sh "dist/jikim-${{ steps.version.outputs.version }}.tar.gz"

      - name: 검증 산출물 보관
        uses: actions/upload-artifact@v7
        with:
          name: jikim-${{ steps.version.outputs.version }}-offline
          path: |
            dist/jikim-${{ steps.version.outputs.version }}.tar.gz
            dist/jikim-${{ steps.version.outputs.version }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
