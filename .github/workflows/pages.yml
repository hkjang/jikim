name: GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: 홍보·가이드 페이지 배포
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7

      - name: Pages 설정
        uses: actions/configure-pages@v6

      - name: 정적 문서 기본 검증
        run: node scripts/verify-docs.mjs

      - name: Pages 산출물 업로드
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Pages 배포
        id: deployment
        uses: actions/deploy-pages@v5
